[package]
name = "zec-desk-maker"
description = "ZEC Desk's market maker: encrypted quotes on Sepolia, the ZEC leg through Seam's CLI, settlement"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false

[[bin]]
name = "zec-desk-maker"
path = "src/main.rs"

[dependencies]
alloy = "=2.5.0"
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal", "sync"] }
toml = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Zama's Rust client talks to Zama's SDK daemon over a Unix socket: the maker's FHE runs on Linux or macOS only. The
# client and the daemon image (ghcr.io/zama-ai/sdk-daemon) must be the same exact version.
[target.'cfg(unix)'.dependencies]
zama_sdk = { version = "=3.8.0-beta.19", features = ["alloy"] }

[dev-dependencies]
tempfile = "3"
